name: logfitness_membership_flutter
description: "LOG Fitness — the members' app for Lord of Gyms, over the same Supabase project as the console and Gym Tross."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.10.7
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  go_router: ^17.5.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  flutter_secure_storage: ^11.0.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  # Opens the gym's phone / legal pages. Declared because this app imports it.
  url_launcher: ^6.3.1
  # Renders the minted check-in token (Phase 4).
  qr_flutter: ^4.1.0
  # App version on the profile screen.
  package_info_plus: ^10.2.2
  # Brightness boost while the QR is on screen (Phase 4).
  screen_brightness: ^2.1.0
  # Door QR scan check-in (camera).
  mobile_scanner: ^7.4.0
  # Only for openAppSettings() on the "camera denied" card: mobile_scanner
  # reports the denial but has no way to send the member to Settings.
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0
  custom_lint: ^0.8.1

flutter:
  uses-material-design: true
  generate: true

dependency_overrides:
  # path_provider_foundation 2.6.0 pulls objective_c, whose native build hooks
  # break `dart compile aot-snapshot` on Dart 3.10 -- that is how build_runner
  # and custom_lint compile their entrypoints, so codegen fails outright.
  path_provider_foundation: 2.4.1
